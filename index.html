<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6b62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>رتّب الزمن</title>
<meta name="description" content="لعبة عائلية: رتّب الأحداث من الأقدم إلى الأحدث">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e6b62'/><path d='M20 50h60' stroke='%23fff' stroke-width='6'/><circle cx='28' cy='50' r='9' fill='%23f0b84a'/><circle cx='50' cy='50' r='9' fill='%23fff'/><circle cx='72' cy='50' r='9' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: a single centered column, like a pocket almanac; events are cards on a vertical time rail (top = oldest). */
:root{
  --bg:#edf1ef; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#10201f; --muted:#5b6b69; --line:#cfd9d6;
  --accent:#0e6b62; --accent-ink:#ffffff; --gold:#c98a12; --good:#18794e; --bad:#b3343a;
  --c-arab:#b8720c; --c-islam:#18794e; --c-cup:#1f5fbf; --c-plague:#b3343a; --c-family:#7a4bb8; --c-tv:#b03a7a;
  --team-a:#1f5fbf; --team-b:#b8720c;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1413; --surface:#14201f; --surface-2:#192826; --ink:#e6efed; --muted:#93a6a3; --line:#2a3d3b;
  --accent:#3fbfae; --accent-ink:#06211e; --gold:#f0b84a; --good:#4cc48a; --bad:#f07479;
  --c-arab:#e9a640; --c-islam:#4cc48a; --c-cup:#6fa3f2; --c-plague:#f07479; --c-family:#b38cf0; --c-tv:#ee8fc0;
  --team-a:#6fa3f2; --team-b:#e9a640;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1413; --surface:#14201f; --surface-2:#192826; --ink:#e6efed; --muted:#93a6a3; --line:#2a3d3b;
  --accent:#3fbfae; --accent-ink:#06211e; --gold:#f0b84a; --good:#4cc48a; --bad:#f07479;
  --c-arab:#e9a640; --c-islam:#4cc48a; --c-cup:#6fa3f2; --c-plague:#f07479; --c-family:#b38cf0; --c-tv:#ee8fc0;
  --team-a:#6fa3f2; --team-b:#e9a640;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.6}
#app{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700;line-height:1.3}
h1{font-size:2.6rem;color:var(--accent)}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel.admin{border:2px dashed var(--accent)}
button,input,select{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.mv:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
label,.lbl{font-weight:700;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px;min-height:48px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.badge{align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 10px}

.hero{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.hero .sub{font-size:1.1rem;color:var(--muted)}
.rail{display:flex;justify-content:space-between;align-items:center;position:relative;margin-top:10px;padding:14px 0 0;font-size:.8rem;color:var(--muted)}
.rail::before{content:"";position:absolute;inset:4px 0 auto 0;height:2px;background:linear-gradient(to left,var(--c-islam),var(--c-arab),var(--c-plague),var(--c-cup))}
.rail span{position:relative}
.rail span::before{content:"";position:absolute;top:-14px;right:50%;transform:translateX(50%);width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-weight:700}
.chip small{font-weight:400;color:var(--muted);font-size:.8rem}
.chip[aria-pressed="true"]{border-color:var(--cc,var(--accent));background:color-mix(in srgb,var(--cc,var(--accent)) 12%,var(--surface))}
.chip:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:6px}
.seg .chip{flex:1;text-align:center;align-items:center}
.tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--cc);border:1px solid var(--cc);border-radius:999px;padding:0 8px;line-height:1.6;white-space:nowrap}

/* timer */
.timer{display:flex;align-items:center;gap:12px}
.timer .bar{flex:1;height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.timer .bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:right;transition:transform .25s linear}
.timer .sec{font-family:var(--display);font-size:1.8rem;min-width:2.4ch;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.timer.low .bar i{background:var(--bad)}
.timer.low .sec{color:var(--bad)}

.ends{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:.85rem}
ol.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:pos}
ol.order li{counter-increment:pos;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--cc,var(--accent));border-radius:12px;padding:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:grab}
ol.order li::before{content:counter(pos,arabic-indic);font-family:var(--display);font-size:1.25rem;color:var(--muted);text-align:center}
ol.order li .t{font-weight:700;min-width:0}
ol.order li .n{font-size:.82rem;color:var(--muted)}
ol.order .mvs{display:flex;flex-direction:column;gap:4px}
.mv{width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:1rem;line-height:1}
ol.order.locked li{cursor:default;opacity:.85}
ol.order.locked .mvs{visibility:hidden}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 20%,transparent)}

.tl{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:10px}
.tl::before{content:"";position:absolute;top:8px;bottom:8px;right:44px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;position:relative}
.tl .yr{font-family:var(--display);font-size:1.05rem;color:var(--cc);text-align:center;background:var(--bg);position:relative;z-index:1;line-height:1.4;padding-block:2px}
.tl .body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ok{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}

table.sc{width:100%;border-collapse:collapse}
table.sc td{padding:10px 6px;border-bottom:1px solid var(--line)}
table.sc tr:last-child td{border-bottom:0}
table.sc td.num{text-align:left;font-weight:700;white-space:nowrap}
table.sc td.rk{width:30px;font-family:var(--display);color:var(--muted)}
.me{color:var(--accent)}
.plus{color:var(--good);font-size:.85rem;font-weight:700;margin-inline-start:6px}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700}
.big{font-family:var(--display);font-size:3rem;color:var(--gold);line-height:1}
.people{display:flex;flex-wrap:wrap;gap:8px}
.people span,.people button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
.people .done{border-color:var(--good);color:var(--good)}

/* teams */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border:2px solid var(--tc);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.team h3{color:var(--tc)}
.team .people button{cursor:pointer;border-color:var(--tc)}
.team-score{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;border-inline-start:5px solid var(--tc);padding:8px 12px;background:var(--surface-2);border-radius:10px}
.team-score .tn{font-family:var(--display);font-size:1.2rem;color:var(--tc)}
.team-score .tp{font-family:var(--display);font-size:1.6rem}
.team-score .mem{grid-column:1/-1;font-size:.85rem;color:var(--muted)}

.fam{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fam li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.fam li > div{min-width:0}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);z-index:20}
.back{align-self:flex-start}
@media (prefers-reduced-motion:no-preference){.panel,.tl li{animation:rise .35s ease both}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:reduce){.timer .bar i{transition:none}}

.qr{width:200px;max-width:100%;align-self:center;background:#fff;border-radius:12px;padding:6px}
.qr svg{display:block;width:100%;height:auto}
.room .code{font-family:var(--display);font-size:3rem;letter-spacing:.2em;text-align:center;color:var(--accent);line-height:1.1}
.linkbox{font-size:.85rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-wrap:anywhere;user-select:all}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center}
.people .off{opacity:.5;text-decoration:line-through}
.ready{text-align:center;align-items:center;border:2px solid var(--cc)}
.readycat{font-family:var(--display);font-size:2.2rem;color:var(--cc);line-height:1.2}
.timer.wait .bar i{background:var(--muted)}
.timer.wait .sec{color:var(--muted)}
.qcard{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--cc);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
ol.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ol.mini li{display:grid;grid-template-columns:minmax(3.2em,auto) 1fr auto;gap:8px;align-items:baseline;font-size:.92rem}
ol.mini .y{font-family:var(--display);color:var(--cc)}
ol.mini .tt{min-width:0}
.spinner{width:44px;height:44px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.getready{text-align:center;align-items:center;border:2px solid var(--accent)}
.gr{font-size:2.6rem;color:var(--accent)}
.myteam{font-size:1.15rem;border:2px solid var(--tc);color:var(--tc);border-radius:999px;padding:4px 16px}
.mine{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:1.05rem}
.mine strong{font-family:var(--display);color:var(--accent)}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--cc);color:var(--cc);font-weight:700;opacity:.45}
.qd.past{opacity:.9;background:color-mix(in srgb,var(--cc) 15%,transparent)}
.qd.now{opacity:1;background:var(--cc);color:var(--surface)}
.roomgrid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.roomgrid .qr{width:150px}
@media (max-width:420px){.roomgrid{grid-template-columns:1fr}.roomgrid .qr{width:180px}}
.winner{text-align:center;align-items:center;border:2px solid var(--gold)}
.winner h2{font-size:2.2rem;color:var(--gold)}
tr.meRow td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.big-start{font-size:1.2rem;min-height:60px}
.hist{display:flex;flex-direction:column;gap:10px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.hcard .when{font-size:.85rem;color:var(--muted)}
.hcard .win{font-family:var(--display);font-size:1.2rem;color:var(--gold)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.danger-link{color:var(--bad)}
.confirm{border:2px solid var(--bad)}
.secs{display:grid;grid-template-columns:auto 5em auto 1fr;gap:8px;align-items:center}
.secs input{text-align:center;font-family:var(--display);font-size:1.2rem;padding:8px}
.secs .mv{width:44px;height:48px;font-size:1.3rem}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:6px 12px}
.plist .pn{min-width:0;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--good)}
.dot.off{background:var(--muted)}
#net{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--gold);color:#1a1300;font-weight:700;text-align:center;padding:8px 16px;border-radius:0 0 12px 12px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body data-page="player">
<div id="net" hidden></div>
<div id="app" dir="rtl" lang="ar">
  <header class="hero">
    <h1>رتّب الزمن</h1>
    <p class="sub">لعبة العائلة: رتّب الأحداث من الأقدم إلى الأحدث</p>
    <div class="rail" aria-hidden="true"><span>٦٢٢</span><span>١٤٥٣</span><span>١٩١٨</span><span>١٩٣٢</span><span>٢٠٢٢</span></div>
  </header>
  <main id="main" class="stack"></main>
</div>
<div id="toast" hidden></div>
<script src="lib/peerjs.min.js"></script>
<script src="lib/Sortable.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="events.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
